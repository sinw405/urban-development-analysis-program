name: urban-development-analysis
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: urban-dev-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/urban_dev
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./rules:/workspace/rules:ro

  postgres:
    image: postgres:16-alpine
    container_name: urban-dev-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: urban_dev
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d urban_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:


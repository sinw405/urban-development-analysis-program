name: urban-development-analysis
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: urban-dev-backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/urban_dev
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-0}
      GENERATION_PROVIDER: ${GENERATION_PROVIDER:-}
      GENERATION_BASE_URL: ${GENERATION_BASE_URL:-https://api.openai.com/v1}
      GENERATION_API_KEY: ${GENERATION_API_KEY:-}
      GENERATION_MODEL: ${GENERATION_MODEL:-}
      GENERATION_TIMEOUT_SECONDS: ${GENERATION_TIMEOUT_SECONDS:-30}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./rules:/workspace/rules:ro

  postgres:
    image: pgvector/pgvector:pg16
    container_name: urban-dev-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: urban_dev
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d urban_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:


name: urban-development-analysis-prod
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: production
      DEBUG: "false"
      MOLEG_LIVE_TEST_ENABLED: "false"
      TEST_FIXTURE_ENABLED: "false"
      LOAD_TEST_FIXTURES: "false"
      AUTO_SEED: "false"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    command: ["python", "-m", "app.production_entrypoint", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: production
      DEBUG: "false"
      MOLEG_LIVE_TEST_ENABLED: "false"
      TEST_FIXTURE_ENABLED: "false"
      LOAD_TEST_FIXTURES: "false"
      AUTO_SEED: "false"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      CORS_ALLOWED_ORIGINS: ""
      LAW_UPDATE_SCHEDULER_ENABLED: ${LAW_UPDATE_SCHEDULER_ENABLED:-false}
      MOLEG_API_ENABLED: ${MOLEG_API_ENABLED:-false}
      MOLEG_API_BASE_URL: ${MOLEG_API_BASE_URL:-}
      MOLEG_API_KEY: ${MOLEG_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-0}
      GENERATION_PROVIDER: ${GENERATION_PROVIDER:-}
      GENERATION_BASE_URL: ${GENERATION_BASE_URL:-}
      GENERATION_API_KEY: ${GENERATION_API_KEY:-}
      GENERATION_MODEL: ${GENERATION_MODEL:-}
    command: ["python", "-m", "app.production_entrypoint"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: /
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_prod_data:
    name: ${POSTGRES_VOLUME_NAME:-urban-development-analysis-prod-db}


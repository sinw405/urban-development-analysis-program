version: "0.2.0"
phase: "Phase 2 Rule Engine"
notes:
  - "Procedure rules are draft workflow candidates for general urban development projects."
  - "Legal basis values are placeholders only."
  - "Finalize legal article references later through MOLEG Open API and expert review."
standard_procedure_graph:
  - stage_code: "ZONE_DESIGNATION_PROPOSAL"
    stage_name: "구역지정 제안"
    sequence: 10
    depends_on: []
    detail_step_codes:
      - "PROJECT_BASIC_REVIEW"
      - "PUBLIC_IMPLEMENTER_COORDINATION"
      - "PRIVATE_IMPLEMENTER_QUALIFICATION_REVIEW"
      - "SPC_GOVERNANCE_REVIEW"
      - "ZONE_DESIGNATION_REVIEW"
    legal_basis_status: "unresolved"
  - stage_code: "ZONE_DESIGNATION_NOTIFICATION"
    stage_name: "구역 지정·고시"
    sequence: 20
    depends_on: ["ZONE_DESIGNATION_PROPOSAL"]
    detail_step_codes:
      - "RESIDENT_OPINION_HEARING"
      - "RELATED_AGENCY_CONSULTATION"
      - "URBAN_PLANNING_COMMITTEE_REVIEW"
      - "ZONE_DESIGNATION_NOTIFICATION"
    legal_basis_status: "unresolved"
  - stage_code: "DEVELOPMENT_PLAN"
    stage_name: "개발계획"
    sequence: 30
    depends_on: ["ZONE_DESIGNATION_NOTIFICATION"]
    detail_step_codes:
      - "DEVELOPMENT_PLAN_ESTABLISHMENT"
      - "IMPLEMENTER_DESIGNATION_REVIEW"
    legal_basis_status: "unresolved"
  - stage_code: "IMPLEMENTATION_PLAN_AUTHORIZATION"
    stage_name: "실시계획 인가"
    sequence: 40
    depends_on: ["DEVELOPMENT_PLAN"]
    detail_step_codes:
      - "LAND_ACQUISITION_REVIEW"
      - "REPLOTTING_PLAN_REVIEW"
      - "MIXED_METHOD_COORDINATION"
      - "IMPLEMENTATION_PLAN_AUTHORIZATION"
    legal_basis_status: "unresolved"
  - stage_code: "PROJECT_IMPLEMENTATION"
    stage_name: "사업시행"
    sequence: 50
    depends_on: ["IMPLEMENTATION_PLAN_AUTHORIZATION"]
    detail_step_codes: ["PROJECT_IMPLEMENTATION"]
    legal_basis_status: "unresolved"
  - stage_code: "COMPLETION"
    stage_name: "준공"
    sequence: 60
    depends_on: ["PROJECT_IMPLEMENTATION"]
    detail_step_codes: ["COMPLETION_INSPECTION"]
    legal_basis_status: "unresolved"
common_steps:
  - step_code: "PROJECT_BASIC_REVIEW"
    step_name: "Project basic review"
    sequence: 10
    description: "Review basic project information such as location, area, implementation method, implementer type, and local government."
    required_documents:
      - "Project overview"
      - "Location map"
      - "Land area summary"
      - "Implementation method summary"
    related_agencies:
      - "Relevant local government department"
    estimated_duration: "TODO_EXPERT_REVIEW"
    legal_basis_placeholder:
      - "TODO_MOLEG_API_ARTICLE_CHECK"
    notes:
      - "This step is a draft workflow item and not a final legal determination."

  - step_code: "ZONE_DESIGNATION_REVIEW"
    step_name: "Urban development zone designation proposal or review"
    sequence: 20
    description: "Prepare or review the proposal for urban development zone designation."
    required_documents:
      - "Draft zone designation proposal"
      - "Land use status materials"
      - "Basic development direction"
    related_agencies:
      - "Local government urban development department"
    estimated_duration: "TODO_EXPERT_REVIEW"
    legal_basis_placeholder:
      - "TODO_MOLEG_API_ARTICLE_CHECK"
    notes:
      - "Exact requirements must be verified later."

  - step_code: "RESIDENT_OPINION_HEARING"
    step_name: "Resident opinion hearing and public notice"
    sequence: 30
    description: "Conduct resident opinion hearing, public inspection, and related public notice procedures where required."
    required_documents:
      - "Public notice draft"
      - "Resident opinion collection record"
      - "Public inspection materials"
    related_agencies:
      - "Local government"
      - "Residents and interested parties"
    estimated_duration: "TODO_EXPERT_REVIEW"
    legal_basis_placeholder:
      - "TODO_MOLEG_API_ARTICLE_CHECK"
      - "TODO_LOCAL_ORDINANCE_CHECK"
    notes:
      - "Detailed notice period must be confirmed later."

  - step_code: "RELATED_AGENCY_CONSULTATION"
    step_name: "Related agency consultation"
    sequence: 40
    description: "Consult with relevant agencies on planning, infrastructure, environment, traffic, safety, and cultural heritage issues."
    required_documents:
      - "Consultation request package"
      - "Project plan materials"
      - "Assessment screening materials if applicable"
    related_agencies:
      - "Relevant local government"
      - "Environmental authority - TODO_CONFIRM"
      - "Traffic authority - TODO_CONFIRM"
      - "Cultural heritage authority - TODO_CONFIRM"
      - "Underground safety authority - TODO_CONFIRM"
    estimated_duration: "TODO_EXPERT_REVIEW"
    legal_basis_placeholder:
      - "TODO_MOLEG_API_ARTICLE_CHECK"
    notes:
      - "Agency list is a placeholder and must be refined by jurisdiction and project characteristics."

  - step_code: "URBAN_PLANNING_COMMITTEE_REVIEW"
    step_name: "Urban planning committee review"
    sequence: 50
    description: "Submit the plan for urban planning committee deliberation where required."
    required_documents:
      - "Committee deliberation materials"
      - "Plan drawings"
      - "Consultation result summary"
    related_agencies:
      - "Urban planning committee"
      - "Relevant local government"
    estimated_duration: "TODO_EXPERT_REVIEW"
    legal_basis_placeholder:
      - "TODO_MOLEG_API_ARTICLE_CHECK"
    notes:
      - "Committee type and agenda requirements must be verified."

  - step_code: "ZONE_DESIGNATION_NOTIFICATION"
    step_name: "Zone designation and public notification"
    sequence: 60
    description: "Proceed with designation and public notification after required review and consultation."
    required_documents:
      - "Designation decision document"
      - "Public notification document"
      - "Approved drawings"
    related_agencies:
      - "Competent authority"
      - "Relevant local government"
    estimated_duration: "TODO_EXPERT_REVIEW"
    legal_basis_placeholder:
      - "TODO_MOLEG_API_ARTICLE_CHECK"
    notes:
      - "Final designation authority must be confirmed by project scale and jurisdiction."

  - step_code: "DEVELOPMENT_PLAN_ESTABLISHMENT"
    step_name: "Development plan establishment"
    sequence: 70
    description: "Prepare and establish the development plan for the designated urban development zone."
    required_documents:
      - "Development plan"
      - "Land use plan"
      - "Infrastructure plan"
      - "Financing and implementation plan"
    related_agencies:
      - "Competent authority"
      - "Relevant local government departments"
    estimated_duration: "TODO_EXPERT_REVIEW"
    legal_basis_placeholder:
      - "TODO_MOLEG_API_ARTICLE_CHECK"
    notes:
      - "Plan contents must be verified against current statutes and ordinances."

  - step_code: "IMPLEMENTER_DESIGNATION_REVIEW"
    step_name: "Implementer designation review"
    sequence: 75
    description: "Review whether implementer designation or implementer confirmation is required for the project workflow. Exact legal applicability must be verified later."
    required_documents: []
    related_agencies: []
    estimated_duration: "TODO_EXPERT_REVIEW"
    legal_basis_placeholder:
      - "TODO_MOLEG_API_ARTICLE_CHECK"
    notes:
      - "Added in Phase 17 as a core workflow coverage placeholder. Required documents, agencies, duration, and legal article references remain confirmation-required."
  - step_code: "IMPLEMENTATION_PLAN_AUTHORIZATION"
    step_name: "Implementation plan authorization"
    sequence: 90
    description: "Prepare and obtain authorization for the implementation plan."
    required_documents:
      - "Implementation plan application"
      - "Detailed design documents"
      - "Consultation completion evidence"
    related_agencies:
      - "Competent authority"
      - "Relevant infrastructure agencies"
    estimated_duration: "TODO_EXPERT_REVIEW"
    legal_basis_placeholder:
      - "TODO_MOLEG_API_ARTICLE_CHECK"
    notes:
      - "Required attachments differ by implementation method."

  - step_code: "PROJECT_IMPLEMENTATION"
    step_name: "Project implementation and construction"
    sequence: 100
    description: "Execute the project according to the authorized implementation plan."
    required_documents:
      - "Construction commencement documents"
      - "Progress management records"
      - "Change authorization documents if applicable"
    related_agencies:
      - "Competent authority"
      - "Construction and infrastructure agencies"
    estimated_duration: "TODO_EXPERT_REVIEW"
    legal_basis_placeholder:
      - "TODO_MOLEG_API_ARTICLE_CHECK"
    notes:
      - "Construction period is highly project-specific."

  - step_code: "COMPLETION_INSPECTION"
    step_name: "Completion inspection and project closeout"
    sequence: 110
    description: "Request completion inspection and close the project after required confirmations."
    required_documents:
      - "Completion inspection request"
      - "As-built drawings"
      - "Facility transfer materials"
      - "Final consultation compliance documents"
    related_agencies:
      - "Competent authority"
      - "Facility management agencies"
    estimated_duration: "TODO_EXPERT_REVIEW"
    legal_basis_placeholder:
      - "TODO_MOLEG_API_ARTICLE_CHECK"
    notes:
      - "Closeout requirements must be confirmed by implementation method and authorization conditions."

